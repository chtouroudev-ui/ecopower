# /etc/nginx/sites-available/ecopower  (puis lien dans sites-enabled)
server {
    listen 80;
    server_name eco-power.tn www.eco-power.tn;
    root /var/www/ecopower-laravel/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Fichiers Vite versionnés (hash dans le nom) : cache 1 an
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Images produits et logos servies directement par nginx
    location ~* ^/(products|logos)/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
